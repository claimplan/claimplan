name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:resources
      - name: Verify reproducible synthetic examples
        run: |
          node scripts/generate-examples.mjs
          node scripts/generate-payout.mjs
          git diff --exit-code -- examples
      - run: node scripts/demo.mjs
      - run: npm run verify:package
      - run: npm pack --dry-run
      - name: Verify passing example
        run: node dist/cli.js check examples/handover.xdr --policy examples/policy.json
      - name: Verify expected failure and inconclusive statuses
        shell: bash
        run: |
          set +e
          node dist/cli.js check examples/overlap.xdr --policy examples/policy.json --json
          overlap_status=$?
          node dist/cli.js check examples/handover.xdr --policy examples/missing-time.json --json
          missing_time_status=$?
          test "$overlap_status" -eq 1 && test "$missing_time_status" -eq 2
