name: Native verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Native (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Record Node and OS evidence
        run: node --input-type=module -e "import os from 'node:os'; console.log(JSON.stringify({node:process.version,platform:process.platform,arch:process.arch,kernel:os.release()},null,2))"
      - name: Record npm version
        run: npm --version
      - name: Record macOS version
        if: runner.os == 'macOS'
        run: sw_vers
      - name: Record Windows version
        if: runner.os == 'Windows'
        run: Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture | ConvertTo-Json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node scripts/generate-examples.mjs
      - run: node scripts/generate-payout.mjs
      - run: git diff --exit-code -- examples
      - run: npm run demo
      - run: npm run verify:package
      - run: npm pack --dry-run
